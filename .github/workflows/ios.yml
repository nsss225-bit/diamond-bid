# Builds the iOS app on a cloud Mac and uploads it to TestFlight. Run it from the Actions tab ("Run workflow").
# Needs these repository secrets (see mobile/README.md): APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, and the key itself as
# ASC_KEY_P8 (the .p8 file's text pasted as is, easiest from a phone) or ASC_KEY_P8_BASE64.
name: iOS build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: App Store Connect key
        env:
          P8_TEXT: ${{ secrets.ASC_KEY_P8 }}
          P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$P8_TEXT" ]; then printf '%s\n' "$P8_TEXT" > "$RUNNER_TEMP/AuthKey.p8"
          else echo "$P8_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"; fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey.p8" || { echo "The App Store Connect key secret is missing or not a .p8 key"; exit 1; }
      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=${{ vars.VERSION_NAME || '1.6' }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive
      - name: Upload to TestFlight
        working-directory: mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
